default:
  suites:
    default:
      paths: ['%paths.base%/../features/single']
      contexts:
        - FeatureContext:
            testingbot:
              server: "hub.testingbot.com"
              # Used only when the TESTINGBOT_KEY / TESTINGBOT_SECRET environment variables are not set
              key: "YOUR_TESTINGBOT_KEY"
              secret: "YOUR_TESTINGBOT_SECRET"

              tb:options:
                build: "behat-selenium-sample"
                name: "single-behat-test"

              environments:
                -
                  browserName: chrome
                  browserVersion: latest
                  platformName: WIN11
